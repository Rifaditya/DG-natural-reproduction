plugins {
    id 'fabric-loom' version '1.10.2'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.isxander.dev/releases" }
    maven { url "https://maven.isxander.dev/snapshots" }
    maven { url = "https://api.modrinth.com/maven" }
    flatDir {
        dirs 'e:/Minecraft Project/Dasik Library v1.20.1/Archive Jar of all versions/MC 1.20.1'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modImplementation "net.dasik.social:dasik-library:${project.dasik_library_version}"

    modCompileOnly "com.terraformersmc:modmenu:7.2.2"
    modCompileOnly("dev.isxander.yacl:yet-another-config-lib-fabric:3.2.1+1.20") {
        transitive = false
    }

    testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.0"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.0"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.0"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 17
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    archiveBaseName = project.archives_base_name
    from("LICENSE") {
        rename "LICENSE_${project.archives_base_name}", "LICENSE"
    }
}

remapJar {
    archiveBaseName = project.archives_base_name
}

afterEvaluate {
    tasks.register('archiveReleaseJar', Copy) {
        dependsOn build
        from remapJar.archiveFile
        into file("Archive")
        doLast {
            def jarFile = remapJar.archiveFile.get().asFile
            println "[AUTO-ARCHIVE] Successfully copied ${jarFile.name} to local Archive: ${destinationDir.absolutePath}"

            // 1. Mod Root Archive
            def outerArchive = file("../../Archive")
            if (outerArchive.exists()) {
                copy {
                    from jarFile
                    into outerArchive
                }
                println "[AUTO-ARCHIVE] Successfully copied ${jarFile.name} to root Archive: ${outerArchive.canonicalPath}"
            }

            // 2. Central Release Hub Archives Sync
            File hubCandidate = projectDir
            File hubDir = null
            while (hubCandidate != null) {
                File checkDir = new File(hubCandidate, "minecraft-mod-release-hub")
                if (checkDir.exists()) {
                    hubDir = checkDir
                    break
                }
                hubCandidate = hubCandidate.parentFile
            }
            if (hubDir == null) {
                File fallback = new File("E:/Minecraft Project/minecraft-mod-release-hub")
                if (fallback.exists()) hubDir = fallback
            }
            if (hubDir != null && hubDir.exists()) {
                File hubConfigFile = new File(hubDir, "config/platform_projects.json")
                if (hubConfigFile.exists()) {
                    try {
                        def hubJson = new groovy.json.JsonSlurper().parse(hubConfigFile)
                        def curPath = projectDir.canonicalPath.replace('\\', '/').toLowerCase()
                        def matchedMod = hubJson.find { name, data ->
                            data.root_dir && curPath.contains(data.root_dir.replace('\\', '/').toLowerCase())
                        }?.key
                        if (matchedMod) {
                            File targetArchiveDir = new File(hubDir, "archives/${matchedMod}")
                            if (!targetArchiveDir.exists()) {
                                targetArchiveDir.mkdirs()
                            }
                            copy {
                                from jarFile
                                into targetArchiveDir
                            }
                            println "[HUB-ARCHIVE] Successfully copied ${jarFile.name} to release hub archives: ${targetArchiveDir.canonicalPath}"
                        }
                    } catch (Exception e) {
                        println "[HUB-ARCHIVE] Note: Could not copy to release hub: ${e.message}"
                    }
                }
            }

            // 3. Modrinth Profile Auto-Deploy
            def profileModsDir = file("C:/Users/fmrif/AppData/Roaming/ModrinthApp/profiles/Fabric 1.20.1/mods")
            if (profileModsDir.exists()) {
                profileModsDir.listFiles().each { f ->
                    if (f.name.startsWith("natural-reproduction-") && f.name.endsWith(".jar") && !f.name.equals(jarFile.name)) {
                        println "[AUTO-DEPLOY] Purging stale version: ${f.name}"
                        f.delete()
                    }
                }
                copy {
                    from jarFile
                    into profileModsDir
                }
                println "[AUTO-DEPLOY] Successfully deployed ${jarFile.name} to Modrinth profile: ${profileModsDir.absolutePath}"
            }

            // 4. External Vault D:\
            File vaultDir = new File("D:/Minecraft Mod Archive Jars/Natural Reproduction")
            if (vaultDir.exists()) {
                copy {
                    from jarFile
                    into vaultDir
                }
                println "[VAULT-ARCHIVE] Successfully copied ${jarFile.name} to external vault: ${vaultDir.canonicalPath}"
            }
        }
    }
    build.finalizedBy archiveReleaseJar
}
